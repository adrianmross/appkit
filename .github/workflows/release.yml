name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Fragments under .changelogs wait on main until a release; the release
      # PR removes the ones it ships. Merge that PR when a batch is worth a
      # version, not after every change.
      - id: release-pr
        if: steps.release.outputs.prs_created == 'true'
        uses: adrianmross/changelogger@v0.11.0
        with:
          command: release-info
        env:
          CHANGELOGGER_RELEASE_PRS: ${{ steps.release.outputs.prs }}
      - if: steps.release-pr.outputs.head_ref != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-pr.outputs.head_ref }}
          path: release-pr
      - if: steps.release-pr.outputs.head_ref != ''
        uses: adrianmross/changelogger@v0.11.0
        with:
          command: consume
          working-directory: release-pr
      - if: steps.release-pr.outputs.head_ref != ''
        working-directory: release-pr
        env:
          HEAD_REF: ${{ steps.release-pr.outputs.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .changelogs; then
            echo "No fragments to consume."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .changelogs
          git commit -m "chore(release): consume changelog fragments"
          git push origin "HEAD:${HEAD_REF}"

      # The UI package is not on a registry. Each release carries it as a
      # tarball, and an app depends on that URL.
      - uses: actions/checkout@v4
        if: steps.release.outputs.release_created
      - uses: actions/setup-node@v4
        if: steps.release.outputs.release_created
        with:
          node-version: 22
      - name: Attach the UI package
        if: steps.release.outputs.release_created
        working-directory: ui
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          npm pack
          mv adrianmross-appkit-ui-*.tgz appkit-ui.tgz
          gh release upload "$TAG" appkit-ui.tgz
